#!/hint/bash
# Preserve distribution build flags while enabling LTO for local packages.
source /etc/makepkg.conf
_thorch_options=()
for _thorch_option in "${OPTIONS[@]}"; do
  [[ "${_thorch_option#!}" == lto ]] || _thorch_options+=("$_thorch_option")
done
OPTIONS=("${_thorch_options[@]}" lto)
unset _thorch_options _thorch_option
