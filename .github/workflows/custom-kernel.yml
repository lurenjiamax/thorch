name: Custom Thor Kernel Package

on:
  push:
    branches:
      - feat/thor-custom-kernel
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custom-thor-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  kernel:
    needs: checks
    if: github.ref == 'refs/heads/feat/thor-custom-kernel'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      THORCH_DOCKER_IMAGE: thorch-custom-builder:local
      THORCH_KERNEL_JOBS: '4'
      THORCH_ANDROID_USERDATA: '1'
      # The historical 20260730 nightly has expired upstream. Pin a verified
      # import template explicitly; do not silently follow the rolling latest.
      ROCKNIX_KERNEL_RELEASE: nightly-20261009
      ROCKNIX_KERNEL_IMAGE_SHA256: 98fd3a08a75df9d394888db86f935fccbcd1204d93d88bd9db1b70b42f6a5cc7
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Resolve maintained source pins
        id: sources
        run: |
          source source-checkouts.conf
          echo "kernel=$KERNEL_SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tme=$TME_SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: lurenjiamax/linux-thorch
          ref: ${{ steps.sources.outputs.kernel }}
          path: kernel-src
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: lurenjiamax/thorch-tme
          ref: ${{ steps.sources.outputs.tme }}
          path: tme-src
      - name: Build native ARM64 builder
        run: make docker-image-build
      - name: Build pinned source kernel
        run: |
          set -euo pipefail
          docker run --privileged --rm --volume "$PWD:/work" --workdir /work \
            --env THORCH_KERNEL_JOBS --env THORCH_ANDROID_USERDATA --env ROCKNIX_KERNEL_RELEASE \
            --env ROCKNIX_KERNEL_IMAGE_SHA256 "$THORCH_DOCKER_IMAGE" \
            bash -lc '
              set -euo pipefail
              for checkout in /work /work/kernel-src /work/tme-src; do
                git config --global --add safe.directory "$checkout"
              done
              bash scripts/sync-rocknix-sources.sh
              bash scripts/sync-rocknix-kernel.sh --skip-runtime-import
            '
      - name: Package and validate kernel
        run: |
          set -euo pipefail
          docker run --rm --env GITHUB_SHA --volume "$PWD:/work" --workdir /work \
            "$THORCH_DOCKER_IMAGE" bash -lc '
              set -euo pipefail
              for checkout in /work /work/kernel-src /work/tme-src; do
                git config --global --add safe.directory "$checkout"
              done
              bash scripts/package-custom-kernel.sh
            '
          sudo chown -R "$(id -u):$(id -g)" output
      - name: Publish experimental kernel prerelease
        run: |
          set -euo pipefail
          version=$(cat output/custom-kernel/version.txt)
          tag="custom-kernel-${version}-${GITHUB_SHA:0:12}"
          gh release create "$tag" output/custom-kernel/*.pkg.tar.zst \
            output/custom-kernel/SHA256SUMS output/custom-kernel/INSTALL.md \
            output/custom-kernel/PROVENANCE \
            output/custom-kernel/TME-PROVENANCE \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Experimental AYN Thor SM8550 kernel ${version}" \
            --notes-file output/custom-kernel/INSTALL.md
