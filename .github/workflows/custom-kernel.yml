name: Custom Thor Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custom-thor-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  kernel:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 720
    env:
      GH_TOKEN: ${{ github.token }}
      THORCH_DOCKER_IMAGE: thorch-custom-builder:local
      THORCH_KERNEL_JOBS: '4'
      THORCH_ANDROID_USERDATA: '1'
      # Resolve latest once, verify its official checksum, record the actual tag.
      ROCKNIX_KERNEL_RELEASE: latest
      ROCKNIX_KERNEL_ALLOW_UNVERIFIED: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Resolve maintained source pins
        id: sources
        run: |
          python3 scripts/resolve-custom-sources.py \
            --output output/custom-sources.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: lurenjiamax/linux-thorch
          ref: ${{ steps.sources.outputs.kernel }}
          path: kernel-src
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: lurenjiamax/thorch-tme
          ref: ${{ steps.sources.outputs.tme }}
          path: tme-src
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: lurenjiamax/InputPlumber
          ref: ${{ steps.sources.outputs.inputplumber }}
          path: inputplumber-src
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: lurenjiamax/thorch-motion
          ref: ${{ steps.sources.outputs.motion }}
          path: motion-src
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: lurenjiamax/thorch-dump-debug
          ref: ${{ steps.sources.outputs.dump }}
          path: dump-src
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: lurenjiamax/hexagonrpc
          ref: ${{ steps.sources.outputs.hexagonrpc }}
          path: hexagonrpc-src
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: lurenjiamax/libssc
          ref: ${{ steps.sources.outputs.libssc }}
          path: libssc-src
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: lurenjiamax/powerdevil
          ref: ${{ steps.sources.outputs.powerdevil }}
          path: sources/powerdevil
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: lurenjiamax/gamescope
          ref: ${{ steps.sources.outputs.gamescope }}
          path: sources/gamescope
          submodules: recursive
      - name: Build native ARM64 builder
        run: make docker-image-build
      - name: Fetch checksum-pinned Thor sensor firmware and copyright notice
        run: python3 scripts/sync-thor-sensor-firmware.py
      - name: Build pinned source kernel
        run: |
          set -euo pipefail
          docker run --privileged --rm --volume "$PWD:/work" --workdir /work \
            --env THORCH_KERNEL_JOBS --env THORCH_ANDROID_USERDATA \
            --env ROCKNIX_KERNEL_RELEASE --env ROCKNIX_KERNEL_ALLOW_UNVERIFIED \
            "$THORCH_DOCKER_IMAGE" \
            bash -lc '
              set -euo pipefail
              for checkout in /work /work/kernel-src /work/tme-src; do
                git config --global --add safe.directory "$checkout"
              done
              bash scripts/sync-rocknix-kernel.sh
            '
      - name: Build and validate production-default custom image
        run: |
          set -euo pipefail
          docker run --privileged --rm --env GITHUB_SHA --volume "$PWD:/work" --workdir /work \
            "$THORCH_DOCKER_IMAGE" bash -lc '
              set -euo pipefail
              for checkout in /work /work/kernel-src /work/tme-src; do
                git config --global --add safe.directory "$checkout"
              done
               bash scripts/build-custom-image.sh
            '
          sudo chown -R "$(id -u):$(id -g)" output
      - name: Retain completed kernel and Mesa packages
        if: always()
        run: |
          set -euo pipefail
          mkdir -p output/install-packages
          shopt -s nullglob
          for package in output/custom-image/linux-thorch-*.pkg.tar.zst \
              output/custom-image/thorch-tme-modules-*.pkg.tar.zst \
              output/custom-kernel/linux-thorch-*.pkg.tar.zst \
              output/custom-kernel/thorch-tme-modules-*.pkg.tar.zst \
              output/repo/thorch-mesa-*.pkg.tar.*; do
            name=${package##*/}
            cp "$package" "output/install-packages/${name//:/_}"
          done
          if [[ -f output/custom-sources.json ]]; then
            cp output/custom-sources.json output/install-packages/SOURCES.json
          fi
      - name: Upload completed installation packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thor-install-packages
          path: output/install-packages/
          if-no-files-found: warn
      - name: Prepare portable image release assets
        run: |
          set -euo pipefail
          for image in output/custom-image/*.img.zst; do
            if (( $(stat -c %s "$image") >= 2147483648 )); then
              split --bytes=1900M --numeric-suffixes=0 --suffix-length=3 "$image" "${image}.part-"
              name=${image##*/}
              printf '\n## Split image download\n\nDownload every `%s.part-*` file into one directory, then run:\n\n```sh\ncat %s.part-* > %s\nsha256sum -c SHA256SUMS\n```\n\nThe original image checksum remains in SHA256SUMS. Verify before decompressing or flashing.\n' "$name" "$name" "$name" >> output/custom-image/INSTALL.md
            fi
          done
          (cd output/custom-image; shopt -s nullglob; parts=(*.img.zst.part-*); if ((${#parts[@]})); then sha256sum "${parts[@]}" >> SHA256SUMS; fi)
      - name: Retain validated image before release upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thor-validated-image
          path: output/custom-image/
          compression-level: 0
          if-no-files-found: error
      - name: Publish custom image and matching package set
        run: |
          set -euo pipefail
          version=$(cat output/custom-kernel/version.txt)
          tag="custom-image-${version}-${GITHUB_RUN_ID}"
          images=()
          for image in output/custom-image/*.img.zst; do
            if [[ -f "${image}.part-000" ]]; then
              images+=("${image}".part-*)
            else
              images+=("$image")
            fi
          done
          gh release create "$tag" output/custom-image/*.pkg.tar.zst \
            "${images[@]}" output/custom-image/SHA256SUMS \
            output/custom-image/SOURCES.json \
            output/custom-image/PROVENANCE output/custom-image/TME-PROVENANCE \
            output/custom-image/INSTALL.md \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "AYN Thor custom image ${version}" \
            --notes-file output/custom-image/INSTALL.md
