# ARM64EC/FEX games can exceed Arch's one-million-VMA default.
# This provides headroom, not a cure for unbounded mapping growth.
# Local /etc/sysctl.d overrides remain available for workload tuning.
vm.max_map_count = 4194304

# Use the current kernel's supported maximum for NT_FILE core notes.
# Extremely fragmented processes may still exceed this diagnostic allowance.
kernel.core_file_note_size_limit = 16777216
